name: CI
on: 
  push: 
jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run unit tests
        run: pytest
